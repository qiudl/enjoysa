<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>原型 02 - 流式回复 + Tool 调用状态</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #f5f7fa; display: flex; justify-content: center; align-items: center; min-height: 100vh; }

  .chat-panel {
    width: 400px; height: 640px;
    background: #fff; border-radius: 16px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.12);
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .chat-header {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    padding: 16px 20px;
    display: flex; align-items: center; gap: 12px;
  }
  .chat-header .avatar { width: 36px; height: 36px; border-radius: 18px; background: rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; font-size: 18px; }
  .chat-header .info { flex: 1; }
  .chat-header .info h4 { color: #fff; font-size: 15px; font-weight: 600; }
  .chat-header .info span { color: rgba(255,255,255,0.75); font-size: 12px; }
  .chat-header .close-btn { width: 28px; height: 28px; border-radius: 14px; background: rgba(255,255,255,0.15); border: none; color: #fff; font-size: 16px; display: flex; align-items: center; justify-content: center; }

  .chat-body { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }

  /* 消息气泡 */
  .msg { display: flex; gap: 10px; max-width: 90%; }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg-avatar { width: 32px; height: 32px; border-radius: 16px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 14px; }
  .msg.ai .msg-avatar { background: linear-gradient(135deg, #f0f0ff, #e8e0ff); }
  .msg.user .msg-avatar { background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; }
  .msg-bubble { padding: 12px 16px; border-radius: 16px; font-size: 14px; line-height: 1.6; }
  .msg.ai .msg-bubble { background: #f4f5f7; color: #333; border-bottom-left-radius: 4px; }
  .msg.user .msg-bubble { background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; border-bottom-right-radius: 4px; }

  /* 思考中动画 */
  .thinking {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 16px;
    background: #f4f5f7;
    border-radius: 16px; border-bottom-left-radius: 4px;
    font-size: 13px; color: #999;
  }
  .thinking-dots { display: flex; gap: 4px; }
  .thinking-dots span {
    width: 6px; height: 6px; border-radius: 3px;
    background: #999; animation: bounce 1.4s ease-in-out infinite;
  }
  .thinking-dots span:nth-child(2) { animation-delay: 0.16s; }
  .thinking-dots span:nth-child(3) { animation-delay: 0.32s; }
  @keyframes bounce {
    0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
    40% { transform: scale(1); opacity: 1; }
  }

  /* 流式文本 + 光标 */
  .streaming-text::after {
    content: '▊';
    animation: cursorBlink 0.8s ease-in-out infinite;
    color: #667eea;
    margin-left: 2px;
  }
  @keyframes cursorBlink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }

  /* Tool 调用状态 */
  .tool-segment {
    background: #f8f9fb;
    border: 1px solid #e8e8f0;
    border-radius: 10px;
    padding: 10px 14px;
    margin: 8px 0;
    font-size: 13px;
  }
  .tool-running {
    display: flex; align-items: center; gap: 8px; color: #667eea;
  }
  .tool-spinner {
    width: 16px; height: 16px;
    border: 2px solid #e8e8f0;
    border-top-color: #667eea;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .tool-done {
    display: flex; align-items: center; gap: 8px; color: #10b981;
  }
  .tool-done .check { font-size: 14px; }
  .tool-done .duration { color: #999; font-size: 12px; margin-left: auto; }

  /* 停止按钮 */
  .chat-input { padding: 12px 16px; border-top: 1px solid #eee; display: flex; align-items: center; gap: 10px; }
  .stop-btn {
    flex: 1; padding: 10px; border-radius: 20px;
    background: #fff; border: 1px solid #e74c3c; color: #e74c3c;
    font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px;
    transition: all 0.2s;
  }
  .stop-btn:hover { background: #fef2f2; }
  .stop-icon { width: 12px; height: 12px; background: #e74c3c; border-radius: 2px; }

  .annotation {
    position: fixed; top: 10px; left: 50%; transform: translateX(-50%);
    background: #ff6b35; color: #fff; font-size: 14px; padding: 8px 16px; border-radius: 8px; z-index: 100;
  }
</style>
</head>
<body>
  <div class="annotation">原型 02：流式回复 + Tool 调用执行中/完成状态 + 停止按钮</div>

  <div class="chat-panel">
    <div class="chat-header">
      <div class="avatar">🤖</div>
      <div class="info"><h4>AI 旅行助手</h4><span>正在回复...</span></div>
      <button class="close-btn">✕</button>
    </div>

    <div class="chat-body">
      <!-- 用户消息 -->
      <div class="msg user">
        <div class="msg-avatar">J</div>
        <div class="msg-bubble">帮我搜索适合家庭带小朋友的旅游产品</div>
      </div>

      <!-- AI 回复区 -->
      <div class="msg ai">
        <div class="msg-avatar">🤖</div>
        <div>
          <!-- Tool 1: 已完成 -->
          <div class="tool-segment">
            <div class="tool-done">
              <span class="check">✅</span>
              <span>search_products 搜索完成</span>
              <span class="duration">120ms</span>
            </div>
          </div>

          <!-- 流式文本 -->
          <div class="msg-bubble">
            <span class="streaming-text">为您找到了 5 个适合家庭出游的产品！以下是推荐：

1. **袋鼠岛野生动物一日游** — 近距离接触考拉、海豹，适合各年龄段小朋友
2. **克莱兰德野生动物园** — 可以亲手喂袋鼠，</span>
          </div>

          <!-- Tool 2: 执行中 -->
          <div class="tool-segment">
            <div class="tool-running">
              <div class="tool-spinner"></div>
              <span>get_product_detail 获取详情中...</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="chat-input">
      <button class="stop-btn">
        <span class="stop-icon"></span>
        停止生成
      </button>
    </div>
  </div>
</body>
</html>
