name: Deploy to AWS Production

on:
  workflow_dispatch:
    inputs:
      scope:
        description: '部署范围'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - frontend
          - backend

env:
  SERVER_IP: 13.239.210.53
  SERVER_USER: ubuntu
  FRONTEND_DEPLOY: /opt/enjoysa/frontend
  BACKEND_DEPLOY: /opt/enjoysa-backend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine deploy scope
        id: scope
        run: |
          SCOPE="${{ github.event.inputs.scope || 'full' }}"
          if [ "$SCOPE" = "full" ] || [ "$SCOPE" = "frontend" ]; then
            echo "frontend=true" >> $GITHUB_OUTPUT
          fi
          if [ "$SCOPE" = "full" ] || [ "$SCOPE" = "backend" ]; then
            echo "backend=true" >> $GITHUB_OUTPUT
          fi

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ env.SERVER_IP }} >> ~/.ssh/known_hosts
          echo "Host aws-prod
            HostName ${{ env.SERVER_IP }}
            User ${{ env.SERVER_USER }}
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking no" > ~/.ssh/config

      # --- Frontend ---
      - name: Setup Node.js
        if: steps.scope.outputs.frontend == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install & Build frontend
        if: steps.scope.outputs.frontend == 'true'
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Deploy frontend
        if: steps.scope.outputs.frontend == 'true'
        run: |
          ssh aws-prod "sudo mkdir -p ${{ env.FRONTEND_DEPLOY }}"
          # Merge new assets without deleting old ones (avoid crash for active users)
          rsync -avz \
            -e "ssh -i ~/.ssh/deploy_key" \
            web/dist/ ${{ env.SERVER_USER }}@${{ env.SERVER_IP }}:${{ env.FRONTEND_DEPLOY }}/
          # Clean up assets older than 7 days (keep recent deploys working)
          ssh aws-prod "find ${{ env.FRONTEND_DEPLOY }}/assets -type f -mtime +7 -delete 2>/dev/null || true"

      # --- Backend ---
      - name: Deploy backend
        if: steps.scope.outputs.backend == 'true'
        run: |
          ssh aws-prod "sudo mkdir -p ${{ env.BACKEND_DEPLOY }} && sudo chown -R ubuntu:ubuntu ${{ env.BACKEND_DEPLOY }}"
          rsync -avz --delete \
            --exclude '.git' \
            --exclude 'tmp' \
            --exclude 'uploads/*' \
            --exclude 'enjoysa-backend' \
            -e "ssh -i ~/.ssh/deploy_key" \
            backend/ ${{ env.SERVER_USER }}@${{ env.SERVER_IP }}:${{ env.BACKEND_DEPLOY }}/backend/
          scp -i ~/.ssh/deploy_key \
            docker-compose.yml ${{ env.SERVER_USER }}@${{ env.SERVER_IP }}:${{ env.BACKEND_DEPLOY }}/docker-compose.yml
          # REQ-20260506-0013: dropped `docker compose down`. `up -d --build`
          # alone recreates only services whose image / config changed, so
          # postgres stays running across deploys (saves ~15-30s) and only
          # the backend container is recycled. `--wait` blocks until backend
          # HEALTHCHECK passes, so the workflow reports success only after
          # /health returns 200 — eliminates the false-positive where deploy
          # "succeeded" while the container was still booting.
          ssh aws-prod "cd ${{ env.BACKEND_DEPLOY }} && \
            export AI_PROJ_BASE='${{ secrets.AI_PROJ_BASE }}' && \
            export AI_PROJ_TOKEN='${{ secrets.AI_PROJ_TOKEN }}' && \
            export AI_PROJ_PROJ_ID='${{ secrets.AI_PROJ_PROJ_ID }}' && \
            export AI_GLM_BASE_URL='${{ secrets.AI_GLM_BASE_URL }}' && \
            export AI_GLM_API_KEY='${{ secrets.AI_GLM_API_KEY }}' && \
            export FEISHU_WEBHOOK_URL='${{ secrets.FEISHU_WEBHOOK_URL }}' && \
            export STRIPE_SECRET_KEY='${{ secrets.STRIPE_SECRET_KEY }}' && \
            export STRIPE_WEBHOOK_SECRET='${{ secrets.STRIPE_WEBHOOK_SECRET }}' && \
            docker compose up -d --build --wait --remove-orphans"

      # --- Nginx Config ---
      - name: Deploy nginx config
        if: steps.scope.outputs.frontend == 'true' || steps.scope.outputs.backend == 'true'
        run: |
          set -e
          # Push new config to /tmp
          rsync -avz -e "ssh -i ~/.ssh/deploy_key" deploy/nginx/sites-available/enjoysa aws-prod:/tmp/enjoysa.new

          ssh aws-prod 'set -e
            # Backup current config with timestamp
            sudo cp /etc/nginx/sites-available/enjoysa /etc/nginx/sites-available/enjoysa.bak.$(date +%Y%m%d-%H%M%S)
            # Show diff for visibility (does not block)
            echo "=== nginx config diff (server vs new) ==="
            diff /etc/nginx/sites-available/enjoysa /tmp/enjoysa.new || true
            echo "=== end diff ==="
            # Replace
            sudo cp /tmp/enjoysa.new /etc/nginx/sites-available/enjoysa
            # Validate
            if ! sudo nginx -t; then
              echo "[ROLLBACK] nginx -t failed, restoring backup"
              LATEST_BAK=$(ls -t /etc/nginx/sites-available/enjoysa.bak.* | head -1)
              sudo cp "$LATEST_BAK" /etc/nginx/sites-available/enjoysa
              exit 1
            fi
            # Reload
            sudo systemctl reload nginx
            # Cleanup
            rm /tmp/enjoysa.new
            echo "nginx config synced and reloaded"
          '

      # --- Verify ---
      - name: Verify deployment
        run: |
          sleep 5
          RESULT=""
          if [ "${{ steps.scope.outputs.frontend }}" = "true" ]; then
            STATUS=$(ssh aws-prod "curl -s -o /dev/null -w '%{http_code}' http://localhost:80/")
            echo "Frontend: HTTP $STATUS"
            [ "$STATUS" = "200" ] || RESULT="Frontend failed (HTTP $STATUS)"
          fi
          if [ "${{ steps.scope.outputs.backend }}" = "true" ]; then
            STATUS=$(ssh aws-prod "curl -s -o /dev/null -w '%{http_code}' http://localhost:6080/health")
            echo "Backend: HTTP $STATUS"
            [ "$STATUS" = "200" ] || RESULT="${RESULT} Backend failed (HTTP $STATUS)"
          fi
          if [ -n "$RESULT" ]; then
            echo "::error::$RESULT"
            exit 1
          fi
          echo "✅ Deployment verified successfully"
